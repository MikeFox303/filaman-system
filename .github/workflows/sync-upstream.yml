name: Guarded upstream sync

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: guarded-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Fire-Devils/filaman-system
  SYNC_BRANCH: sync/upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare exact upstream merge
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main --tags
          local_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse upstream/main)"
          echo "local_sha=${local_sha}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-commit --no-ff upstream/main; then
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --cached --name-only)
          printf '%s\n' "${changed_files[@]}" | tee /tmp/upstream-changed-files.txt

          # Runtime, persistence, localization and release changes always need
          # semantic review. Docs/metadata-only changes may advance automatically
          # after the same full regression gate below.
          sensitive=false
          if printf '%s\n' "${changed_files[@]}" | grep -Eq \
            '^(backend/|frontend/src/|frontend/package(-lock)?\.json$|frontend/scripts/|Dockerfile$|docker-compose|version\.txt$|\.github/workflows/)'; then
            sensitive=true
          fi
          echo "sensitive=${sensitive}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "conflict=false" >> "$GITHUB_OUTPUT"

      - name: Report merge conflict
        if: steps.merge.outputs.conflict == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          title="Upstream sync conflict: ${UPSTREAM_SHA}"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh issue create \
              --title "$title" \
              --body "Guarded sync found merge conflicts against ${UPSTREAM_REPO}@${UPSTREAM_SHA}. Nothing was merged or published. Resolve with semantic review and rerun all release gates."
          fi
          exit 1

      - name: Install uv
        if: steps.merge.outputs.changed == 'true' && steps.merge.outputs.conflict != 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Backend regression gate
        if: steps.merge.outputs.changed == 'true' && steps.merge.outputs.conflict != 'true'
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          uv run pytest tests/test_spool_service.py -q
          uv run pytest \
            tests/test_printers.py \
            tests/test_x2d_external_slot_migration.py \
            tests/test_managed_plugin_service.py \
            tests/test_managed_bambuddy_release.py -q
          test "$(uv run alembic heads | grep -Ec '^[0-9a-zA-Z_]+ ')" -eq 1
          db="$RUNNER_TEMP/upstream-sync.db"
          rm -f "$db"
          DATABASE_URL="sqlite+aiosqlite:///$db" uv run alembic upgrade head
          uv run pytest -q

      - name: Set up Node
        if: steps.merge.outputs.changed == 'true' && steps.merge.outputs.conflict != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Localization and frontend gate
        if: steps.merge.outputs.changed == 'true' && steps.merge.outputs.conflict != 'true'
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check:i18n
          npm run check
          npm test
          npm run lint
          npm run build

      - name: Protected invariants
        if: steps.merge.outputs.changed == 'true' && steps.merge.outputs.conflict != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          grep -Rqs 'source_event_key' backend/app backend/alembic backend/tests
          grep -q 'BAMBUDDY_PLUGIN_VERSION = "1.3.10"' backend/app/services/managed_plugin_service.py
          test -f backend/managed_plugins/bambuddy-1.3.10.zip
          grep -q '1000' backend/alembic/versions/normalize_x2d_external_slots.py
          grep -q '1001' backend/alembic/versions/normalize_x2d_external_slots.py
          grep -q '127.0.0.1:8000' backend/app/api/v1/printers.py
          grep -q 'primary_proxy_invalid_response' backend/app/api/v1/printers.py
          python -m json.tool frontend/src/i18n/en.json >/dev/null
          python -m json.tool frontend/src/i18n/de.json >/dev/null
          python -m json.tool frontend/src/i18n/ru.json >/dev/null
          python -m json.tool frontend/src/i18n/uk.json >/dev/null

      - name: Commit validated merge
        if: steps.merge.outputs.changed == 'true' && steps.merge.outputs.conflict != 'true'
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          git commit -m "chore: sync upstream ${UPSTREAM_SHA}"

      - name: Publish review branch for sensitive changes
        if: steps.merge.outputs.changed == 'true' && steps.merge.outputs.conflict != 'true' && steps.merge.outputs.sensitive == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$SYNC_BRANCH" || true
          git push --force-with-lease origin "HEAD:${SYNC_BRANCH}"
          existing="$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          body="Guarded upstream update from ${UPSTREAM_REPO}@${UPSTREAM_SHA}. Full backend, SQLite migration, X2D/consumption, managed-plugin, localization and frontend gates passed in the sync workflow. Runtime/persistence/localization/release files changed, so automatic merge is intentionally blocked pending semantic review."
          if [[ -z "$existing" ]]; then
            gh pr create --base main --head "$SYNC_BRANCH" --title 'chore: guarded upstream sync' --body "$body"
          else
            gh pr edit "$existing" --body "$body"
          fi

      - name: Auto-advance docs/metadata-only changes
        if: steps.merge.outputs.changed == 'true' && steps.merge.outputs.conflict != 'true' && steps.merge.outputs.sensitive == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
