name: X2D release gate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/x2d-release-gate.yml"
      - ".github/scripts/apply_x2d_auto_update.py"

permissions:
  contents: write

concurrency:
  group: x2d-release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    if: github.head_ref == 'release/x2d-auto-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/x2d-auto-update
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply deterministic product patch
        run: python .github/scripts/apply_x2d_auto_update.py

      - name: Bundle immutable Bambuddy plugin 1.3.8
        run: |
          set -euo pipefail
          mkdir -p backend/managed_plugins
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/MikeFox303/filaman-bambuddy-plugin/462204f4d543067a735535e52a299289e756cb66/dist/bambuddy-1.3.8.zip' \
            -o backend/managed_plugins/bambuddy-1.3.8.zip
          echo 'a41f6bd38f9ebce1f21b620f9ce7ea8ab3984fc2a633cffe18e33518e906d508  backend/managed_plugins/bambuddy-1.3.8.zip' | sha256sum -c -

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Backend static checks
        working-directory: backend
        run: |
          python -m py_compile app/services/plugin_service.py app/services/managed_plugin_service.py app/main.py tests/test_plugin_service.py tests/test_managed_plugin_service.py
          uvx ruff check --select E9,F63,F7,F82 app/services/plugin_service.py app/services/managed_plugin_service.py app/main.py tests/test_plugin_service.py tests/test_managed_plugin_service.py

      - name: Focused backend regressions
        working-directory: backend
        run: uv run pytest tests/test_plugin_service.py tests/test_managed_plugin_service.py -q

      - name: Full backend suite
        working-directory: backend
        run: uv run pytest tests/ --tb=short

      - name: Frontend localization tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm run test -- --run
          npx astro check
          BUILD_MODE=static npm run build

      - name: Release invariants
        run: |
          set -euo pipefail
          echo 'a41f6bd38f9ebce1f21b620f9ce7ea8ab3984fc2a633cffe18e33518e906d508  backend/managed_plugins/bambuddy-1.3.8.zip' | sha256sum -c -
          grep -F 'COPY backend/managed_plugins /app/managed_plugins' Dockerfile
          grep -F 'await ensure_managed_plugins(db)' backend/app/main.py
          test "$(python - <<'PY'
          import json
          print(json.load(open('frontend/src/i18n/ru.json'))['printers']['slotOccupied'])
          PY
          )" = 'Занят'

      - name: Commit validated product tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-shot-x2d-auto-update.yml
          git rm .github/workflows/x2d-release-gate.yml
          git rm .github/scripts/apply_x2d_auto_update.py
          git add -A
          git commit -m 'release: harden and automate X2D integration update'
          git push origin HEAD:release/x2d-auto-update
