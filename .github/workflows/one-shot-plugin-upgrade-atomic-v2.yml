name: One-shot atomic plugin upgrade hardening v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-plugin-upgrade-atomic-v2.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-plugin-upgrade-atomic-v2
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plugin-upgrade-atomic
          fetch-depth: 0

      - name: Apply the reviewed patch script from v1
        run: |
          python - <<'PY2'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/one-shot-plugin-upgrade-atomic.yml').read_text()
          marker = "          python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('v1 patch script marker not found')
          script = workflow.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(script), '<atomic-upgrade-patch>', 'exec'))
          PY2

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Lint changed files
        working-directory: backend
        run: |
          uvx ruff check app/services/plugin_service.py tests/test_plugin_service.py
          uvx ruff format --check app/services/plugin_service.py tests/test_plugin_service.py

      - name: Focused plugin service tests
        working-directory: backend
        run: uv run pytest tests/test_plugin_service.py -q

      - name: Full backend suite
        working-directory: backend
        run: uv run pytest tests/ --tb=short

      - name: Commit validated patch and remove one-shot workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-plugin-upgrade-atomic.yml
          git rm .github/workflows/one-shot-plugin-upgrade-atomic-v2.yml
          git add backend/app/services/plugin_service.py backend/tests/test_plugin_service.py
          git commit -m "fix: make plugin upgrades rollback-safe"
          git push origin HEAD:fix/plugin-upgrade-atomic
