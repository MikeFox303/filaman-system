name: FilaMan Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional image tag (defaults to <upstream>-localized.<run number>)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: filaman-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev
      - name: Consumption and X2D regressions
        run: |
          uv run pytest tests/test_spool_service.py -q
          uv run pytest \
            tests/test_printers.py \
            tests/test_x2d_external_slot_migration.py \
            tests/test_managed_plugin_service.py \
            tests/test_managed_bambuddy_release.py -q
      - name: Validate Alembic topology
        run: |
          HEAD_COUNT="$(uv run alembic heads | grep -E '^[0-9a-zA-Z_]+ ' | wc -l)"
          test "$HEAD_COUNT" -eq 1
          uv run alembic heads
      - name: SQLite migration upgrade
        run: |
          DB="$RUNNER_TEMP/release-gate.db"
          rm -f "$DB"
          DATABASE_URL="sqlite+aiosqlite:///$DB" uv run alembic upgrade head
          test -f "$DB"
      - name: Full backend suite
        run: uv run pytest -q

  frontend:
    name: Frontend + localization
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate RU/UA parity
        run: npm run check:i18n
      - name: Type and Astro checks
        run: npm run check
      - name: Frontend tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  build:
    name: Multi-arch GHCR image
    if: github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select immutable image tag
        id: image
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_TAG}" ]]; then
            tag="${REQUESTED_TAG}"
          else
            tag="$(tr -d '\r\n' < version.txt)-localized.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-localized\.[0-9]+$ ]]; then
            echo "Unsupported image tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64 + arm64
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/mikefox303/filaman-system:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/MikeFox303/filaman-system
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
      - name: Publish immutable release summary
        shell: bash
        run: |
          echo 'Image: `ghcr.io/mikefox303/filaman-system:${{ steps.image.outputs.tag }}@${{ steps.docker.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source: `${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"
