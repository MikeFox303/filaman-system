name: Build localized image

on:
  workflow_run:
    workflows:
      - Localization CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional image tag (defaults to <upstream>-localized.<run number>)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Select immutable image tag
        id: image
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_TAG}" ]]; then
            tag="${REQUESTED_TAG}"
          else
            tag="$(tr -d '\r\n' < version.txt)-localized.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-localized\.[0-9]+$ ]]; then
            echo "Unsupported image tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/mikefox303/filaman-system:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/MikeFox303/filaman-system
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
      - name: Publish build summary
        run: echo 'Image `ghcr.io/mikefox303/filaman-system:${{ steps.image.outputs.tag }}`' >> "$GITHUB_STEP_SUMMARY"
