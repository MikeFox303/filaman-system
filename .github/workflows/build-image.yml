name: Build RU image

on:
  push:
    tags:
      - '*-ru.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag, for example 1.2.42-ru.1'
        required: true
        default: '1.2.42-ru.1'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/mikefox303/filaman-system-ru:${{ inputs.tag || github.ref_name }}
