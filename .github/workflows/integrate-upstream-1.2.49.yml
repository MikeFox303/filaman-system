name: Validate localized upstream 1.2.49 staging

on:
  push:
    branches:
      - integration/upstream-1.2.49

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact upstream baseline
        shell: bash
        env:
          UPSTREAM_SHA: 513c85baf7d66954405fd241cdede41f97a8f3b2
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Fire-Devils/filaman-system.git || true
          git fetch upstream main --tags
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          test "$(cat version.txt | tr -d '\r\n')" = "1.2.49"

      - name: Apply RU and UK translations
        run: node scripts/apply-upstream-1.2.49-i18n.mjs

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Backend regression gate
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          uv run pytest tests/test_spool_service.py -q
          uv run pytest \
            tests/test_spools.py \
            tests/test_printers.py \
            tests/test_x2d_external_slot_migration.py \
            tests/test_managed_plugin_service.py \
            tests/test_managed_bambuddy_release.py -q
          test "$(uv run alembic heads | grep -Ec '^[0-9a-zA-Z_]+ ')" -eq 1
          db="$RUNNER_TEMP/upstream-1.2.49.db"
          rm -f "$db"
          DATABASE_URL="sqlite+aiosqlite:///$db" uv run alembic upgrade head
          uv run pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Localization and frontend gate
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check:i18n
          npm run check
          npm test
          npm run lint
          npm run build

      - name: Protected downstream invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Rqs 'source_event_key' backend/app backend/alembic backend/tests
          grep -q 'BAMBUDDY_PLUGIN_VERSION' backend/app/services/managed_plugin_service.py
          test "$(find backend/managed_plugins -maxdepth 1 -type f -name 'bambuddy-*.zip' | wc -l)" -eq 1
          python -m json.tool backend/managed_plugins/bambuddy-release.json >/dev/null
          grep -q '1000' backend/alembic/versions/normalize_x2d_external_slots.py
          grep -q '1001' backend/alembic/versions/normalize_x2d_external_slots.py
          grep -q '127.0.0.1:8000' backend/app/api/v1/printers.py
          grep -q 'primary_proxy_invalid_response' backend/app/api/v1/printers.py
          grep -q 'Literal\["en", "de", "ru", "uk"\]' backend/app/core/language.py
          grep -q "import ru from '../i18n/ru.json'" frontend/src/lib/i18n.ts
          grep -q "import uk from '../i18n/uk.json'" frontend/src/lib/i18n.ts
          grep -q 'data-i18n-aria-label' frontend/src/lib/i18n.ts
          python -m json.tool frontend/src/i18n/en.json >/dev/null
          python -m json.tool frontend/src/i18n/de.json >/dev/null
          python -m json.tool frontend/src/i18n/ru.json >/dev/null
          python -m json.tool frontend/src/i18n/uk.json >/dev/null

      - name: Commit validated translations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/i18n/ru.json frontend/src/i18n/uk.json
          if git diff --cached --quiet; then
            echo 'Translations already applied.'
            exit 0
          fi
          git commit -m 'i18n: translate FilaMan 1.2.49 additions to RU and UK'
          git push origin HEAD:integration/upstream-1.2.49
