name: Stage managed Bambuddy 1.3.10

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  package:
    if: github.event.pull_request.head.ref == 'release/bambuddy-1.3.10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Checkout verified plugin source
        uses: actions/checkout@v4
        with:
          repository: MikeFox303/filaman-bambuddy-plugin
          ref: 477c0356285d62d5e1f1a3eb9cee88e2d73bcf00
          path: plugin-src
      - name: Build deterministic plugin zip and update pin
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile

          source = Path('plugin-src/bambuddy')
          manifest = json.loads((source / 'plugin.json').read_text(encoding='utf-8'))
          assert manifest['plugin_key'] == 'bambuddy'
          assert manifest['version'] == '1.3.10'

          out_dir = Path('backend/managed_plugins')
          out_dir.mkdir(parents=True, exist_ok=True)
          out = out_dir / 'bambuddy-1.3.10.zip'
          fixed = (2020, 1, 1, 0, 0, 0)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(p for p in source.rglob('*') if p.is_file()):
                  if '__pycache__' in path.parts or path.suffix == '.pyc':
                      continue
                  arc = Path('bambuddy') / path.relative_to(source)
                  info = zipfile.ZipInfo(arc.as_posix(), fixed)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          print('PLUGIN_SHA256=' + digest)

          svc = Path('backend/app/services/managed_plugin_service.py')
          text = svc.read_text(encoding='utf-8')
          text = text.replace('BAMBUDDY_PLUGIN_VERSION = "1.3.9"', 'BAMBUDDY_PLUGIN_VERSION = "1.3.10"')
          import re
          text = re.sub(r'BAMBUDDY_PLUGIN_SHA256 = "[0-9a-f]{64}"', f'BAMBUDDY_PLUGIN_SHA256 = "{digest}"', text)
          text = text.replace('BAMBUDDY_PLUGIN_ASSET = Path("/app/managed_plugins/bambuddy-1.3.9.zip")', 'BAMBUDDY_PLUGIN_ASSET = Path("/app/managed_plugins/bambuddy-1.3.10.zip")')
          svc.write_text(text, encoding='utf-8')

          old = out_dir / 'bambuddy-1.3.9.zip'
          if old.exists():
              old.unlink()

          test = Path('backend/tests/test_managed_bambuddy_release.py')
          test.write_text('''import hashlib\nimport json\nfrom pathlib import Path\nimport zipfile\n\nfrom app.services import managed_plugin_service as managed\n\n\ndef test_managed_bambuddy_1_3_10_asset_matches_pin():\n    repo_backend = Path(__file__).resolve().parents[1]\n    asset = repo_backend / "managed_plugins" / "bambuddy-1.3.10.zip"\n    assert managed.BAMBUDDY_PLUGIN_VERSION == "1.3.10"\n    assert asset.is_file()\n    assert hashlib.sha256(asset.read_bytes()).hexdigest() == managed.BAMBUDDY_PLUGIN_SHA256\n    with zipfile.ZipFile(asset) as zf:\n        manifest = json.loads(zf.read("bambuddy/plugin.json"))\n    assert manifest["plugin_key"] == "bambuddy"\n    assert manifest["version"] == "1.3.10"\n\n\ndef test_managed_bambuddy_does_not_ship_old_1_3_9_asset():\n    repo_backend = Path(__file__).resolve().parents[1]\n    assert not (repo_backend / "managed_plugins" / "bambuddy-1.3.9.zip").exists()\n''', encoding='utf-8')
          PY
          git diff --check
      - name: Commit packaged hotfix
        run: |
          if git diff --quiet; then
            echo 'Package already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A backend/managed_plugins backend/app/services/managed_plugin_service.py backend/tests/test_managed_bambuddy_release.py
          git commit -m 'release: bundle Bambuddy plugin 1.3.10'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
