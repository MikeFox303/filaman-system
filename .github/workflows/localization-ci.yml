name: Localization CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'sync/upstream'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run check
      - run: npm test
      - run: npm run lint
      - run: npm run build

  backend-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run pytest tests/test_language_validation.py tests/test_app_settings.py
