name: Build immutable X2D FilaMan image

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-x2d-filaman-image.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: x2d-filaman-image
  cancel-in-progress: true

jobs:
  build:
    if: github.head_ref == 'release/x2d-filaman-image'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/x2d-filaman-image
          fetch-depth: 0
      - name: Verify validated source ancestor
        run: git merge-base --is-ancestor 22a3e8ca3e841e2debe20f473db036f1549735f0 HEAD
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64+arm64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/mikefox303/filaman-system:1.2.42-localized.32
          labels: |
            org.opencontainers.image.source=https://github.com/MikeFox303/filaman-system
            org.opencontainers.image.revision=22a3e8ca3e841e2debe20f473db036f1549735f0
            org.opencontainers.image.version=1.2.42-localized.32
      - name: Record immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          mkdir -p dist
          cat > dist/x2d-filaman-image.txt <<EOF
          source_commit=22a3e8ca3e841e2debe20f473db036f1549735f0
          tag=ghcr.io/mikefox303/filaman-system:1.2.42-localized.32
          digest=$DIGEST
          image=ghcr.io/mikefox303/filaman-system:1.2.42-localized.32@$DIGEST
          platforms=linux/amd64,linux/arm64
          managed_plugin=bambuddy-1.3.8
          managed_plugin_sha256=a41f6bd38f9ebce1f21b620f9ce7ea8ab3984fc2a633cffe18e33518e906d508
          EOF
          git rm .github/workflows/build-x2d-filaman-image.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/x2d-filaman-image.txt
          git commit -m 'release: record immutable X2D FilaMan image digest'
          git push origin HEAD:release/x2d-filaman-image
