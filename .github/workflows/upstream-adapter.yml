name: Guarded upstream adapter

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: filaman-upstream-adapter
  cancel-in-progress: false

jobs:
  adapt:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/adapt-filaman-1.2.44' &&
      github.event.issue.number == 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-2026-08-22
          fetch-depth: 0

      - name: Build exact guarded merge
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_SHA=c463135e3eabc9f17e809f74d692b78bfb13dc56
          COMMON_BASE=ebc0bcc83e34665bc699a0a259489f7d21d03a80
          UPSTREAM_SHA=ed26335b85413348d547ab12ad9149425ffcb296

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          # Save temporary adaptation helpers before resetting the worktree to
          # the protected application baseline. These files are CI-only and do
          # not become part of the adapted production tree.
          git fetch origin main
          git show origin/main:.github/scripts/adapt_filaman_1_2_44_conflicts.py > /tmp/adapt_conflicts.py
          git show origin/main:.github/scripts/apply_upstream_1_2_44_i18n.py > /tmp/apply_i18n.py
          sed -i 's#ROOT = Path(__file__).resolve().parents\[2\] / "frontend" / "src" / "i18n"#ROOT = Path.cwd() / "frontend" / "src" / "i18n"#' /tmp/apply_i18n.py

          git reset --hard "${LOCAL_SHA}"
          git remote add upstream https://github.com/Fire-Devils/filaman-system.git
          git fetch upstream main --tags

          actual_upstream="$(git rev-parse upstream/main)"
          [[ "${actual_upstream}" == "${UPSTREAM_SHA}" ]] || {
            echo "Upstream moved: expected ${UPSTREAM_SHA}, got ${actual_upstream}" >&2
            exit 1
          }
          [[ "$(git merge-base "${LOCAL_SHA}" upstream/main)" == "${COMMON_BASE}" ]] || {
            echo "Unexpected common base; refusing adaptation" >&2
            exit 1
          }

          set +e
          git merge --no-commit --no-ff upstream/main
          merge_rc=$?
          set -e

          if [[ ${merge_rc} -ne 0 ]]; then
            actual_conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected_conflicts="$(cat <<'EOF'
          backend/app/api/v1/printers.py
          backend/tests/test_printers.py
          frontend/package.json
          frontend/src/i18n/de.json
          frontend/src/i18n/en.json
          frontend/src/pages/admin/system/spoolman-import.astro
          EOF
          )"
            echo "Conflicts detected:"
            printf '%s\n' "${actual_conflicts}"
            [[ "${actual_conflicts}" == "${expected_conflicts}" ]] || {
              echo "Unexpected conflict set; refusing automatic resolution" >&2
              exit 1
            }
            python /tmp/adapt_conflicts.py
          fi

          [[ -z "$(git diff --name-only --diff-filter=U)" ]] || {
            echo "Unresolved merge conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          }

          # Apply complete Russian/Ukrainian Spoolman 1.2.44 localization and
          # require exact key/placeholder parity with the merged English block.
          python /tmp/apply_i18n.py
          git add frontend/src/i18n/ru.json frontend/src/i18n/uk.json

          # These files implement the protected consumption, X2D slot migration,
          # managed-plugin checksum/no-downgrade and MissingGreenlet-safe release.
          # Upstream 1.2.44 does not need to touch them, so any byte-level change
          # is an unexplained conflict and must fail closed.
          protected_paths=(
            backend/alembic/versions/add_spool_event_source_key.py
            backend/alembic/versions/normalize_x2d_external_slots.py
            backend/app/models/spool.py
            backend/app/services/spool_service.py
            backend/app/services/managed_plugin_service.py
            backend/app/services/plugin_service.py
            backend/managed_plugins/bambuddy-1.3.10.zip
            backend/tests/test_spool_service.py
            backend/tests/test_managed_plugin_service.py
            backend/tests/test_managed_bambuddy_release.py
            backend/tests/test_x2d_external_slot_migration.py
          )
          for path in "${protected_paths[@]}"; do
            git diff --quiet "${LOCAL_SHA}" -- "${path}" || {
              echo "Protected file changed unexpectedly: ${path}" >&2
              exit 1
            }
          done

          grep -q 'source_event_key' backend/app/models/spool.py
          grep -q 'BAMBUDDY_PLUGIN_VERSION = "1.3.10"' backend/app/services/managed_plugin_service.py
          grep -q 'bambuddy-1.3.10.zip' backend/app/services/managed_plugin_service.py
          test -f backend/managed_plugins/bambuddy-1.3.10.zip
          grep -q '1000' backend/alembic/versions/normalize_x2d_external_slots.py
          grep -q '1001' backend/alembic/versions/normalize_x2d_external_slots.py
          grep -q '_PRIMARY_PROXY_BASE_URL = "http://127.0.0.1:8000"' backend/app/api/v1/printers.py
          grep -q 'primary_proxy_invalid_response' backend/app/api/v1/printers.py
          test "$(tr -d '\r\n' < version.txt)" = '1.2.44'
          python -m json.tool frontend/src/i18n/en.json >/dev/null
          python -m json.tool frontend/src/i18n/de.json >/dev/null
          python -m json.tool frontend/src/i18n/ru.json >/dev/null
          python -m json.tool frontend/src/i18n/uk.json >/dev/null
          git add -A
          git status --short

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Full backend, consumption and migration gate
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          uv run pytest tests/test_spool_service.py -q
          uv run pytest tests/test_printers.py tests/test_x2d_external_slot_migration.py tests/test_managed_plugin_service.py tests/test_managed_bambuddy_release.py -q
          HEAD_COUNT="$(uv run alembic heads | grep -E '^[0-9a-zA-Z_]+ ' | wc -l)"
          test "$HEAD_COUNT" -eq 1
          uv run alembic heads
          MIGRATION_DB="$RUNNER_TEMP/upstream_adapter_migration.db"
          rm -f "$MIGRATION_DB"
          DATABASE_URL="sqlite+aiosqlite:///$MIGRATION_DB" uv run alembic upgrade head
          test -f "$MIGRATION_DB"
          uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Full frontend and localization gate
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run check:i18n
          npm run check
          npm test
          npm run lint
          npm run build

      - name: Commit and push only after all gates pass
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'chore: adapt FilaMan upstream 1.2.44'
          git push --force-with-lease origin HEAD:sync/upstream-2026-08-22
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.push.outputs.sha }}
        run: >-
          gh pr comment 16 --body
          "Guarded upstream adaptation succeeded. Exact upstream 1.2.44 was merged; protected X2D/consumption/managed-plugin files remained byte-identical; full backend, targeted consumption/X2D, Alembic/SQLite, RU/UK localization, frontend tests/lint/check/build all passed before push. New sync SHA: \`${NEW_SHA}\`."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment 16 --body
          "Guarded upstream adaptation failed. The sync branch is not replaced unless every merge invariant and backend/frontend/migration gate passes. Inspect this Actions run before making any production change."
