name: Fix Ukrainian language label

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-uk-language-label.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'release/x2d-auto-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/x2d-auto-update
      - name: Correct and validate locale files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('frontend/src/i18n/uk.json')
          data = json.loads(path.read_text())
          data['settings']['langEn'] = 'Англійська'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          cd frontend
          npm ci
          npm run check:i18n
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-uk-language-label.yml
          git add frontend/src/i18n/uk.json
          git commit -m 'fix(i18n): translate English language label in Ukrainian'
          git push origin HEAD:release/x2d-auto-update
